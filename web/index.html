<!doctype html>
<html lang="zh-CN">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<meta name="color-scheme" content="dark" />
		<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
		<!-- PWA manifest: relative so nginx sub-path deployments (/pi/) resolve correctly -->
		<link rel="manifest" href="./manifest.webmanifest" crossorigin="use-credentials" />
		<meta name="theme-color" content="#0f172a" />
		<link rel="apple-touch-icon" href="./icons/icon-192.png" />
		<meta name="mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
		<title>PI</title>
		<!-- AbortSignal.any polyfill (pi-desktop local patch, 2026-11-13): the client bundle calls AbortSignal.any (Chrome/Edge >= 116) in device-center fetches; Edge 109 on Win7 throws. No-op on modern browsers. Kept in source so rebuilds keep it; re-apply after git pull. -->
		<script>
			(function () {
				if (typeof AbortSignal === "undefined" || typeof AbortSignal.any === "function") return;
				AbortSignal.any = function (signals) {
					var controller = new AbortController();
					var onAbort = function () { controller.abort(); };
					for (var i = 0; i < signals.length; i++) {
						var s = signals[i];
						if (s.aborted) { controller.abort(); break; }
						s.addEventListener("abort", onAbort, { once: true });
					}
					return controller.signal;
				};
			})();
		</script>
		<!-- 插件公共依赖 Import Maps（支持子路径反代部署） -->
		<script type="importmap">
			{
				"imports": {
					"@pi-web-ui/plugin-sdk/client": "./plugins-shared/client-utils.mjs"
				}
			}
		</script>
	</head>
	<body>
		<div id="root"></div>
		<script type="module" src="/src/main.tsx"></script>
	</body>
</html>
